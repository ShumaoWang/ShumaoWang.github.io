<script>
    $(document).ready(function () {
        {% if site.google_scholar_stats_use_cdn %}
        var gsDataBaseUrl = 'https://cdn.jsdelivr.net/gh/{{ site.repository }}@'
        {% else %}
        var gsDataBaseUrl = 'https://raw.githubusercontent.com/{{ site.repository }}/'
        {% endif %}
        $.getJSON(gsDataBaseUrl + "google-scholar-stats/gs_data.json")
            .done(function (data) {
                var totalCitationEle = document.getElementById('total_cit');
                var totalCitation = data && data['citedby'];
                if (totalCitationEle && typeof totalCitation !== 'undefined') {
                    totalCitationEle.innerHTML = totalCitation;
                }

                var citationEles = document.getElementsByClassName('show_paper_citations');
                Array.prototype.forEach.call(citationEles, function (element) {
                    var paperId = element.getAttribute('data');
                    var publication = data && data['publications'] ? data['publications'][paperId] : null;
                    var numCitations = publication ? publication['num_citations'] : null;
                    if (typeof numCitations !== 'undefined' && numCitations !== null) {
                        element.innerHTML = '| Citations: ' + numCitations;
                    } else {
                        element.innerHTML = '';
                    }
                });
            })
            .fail(function () {
                var citationEles = document.getElementsByClassName('show_paper_citations');
                Array.prototype.forEach.call(citationEles, function (element) {
                    element.innerHTML = '';
                });
            });
    })
</script>
